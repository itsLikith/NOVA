name: nova

services:
  auth_db:
    image: postgres:18.4-alpine3.24
    container_name: auth_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nova_auth}
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nova_network

  auth:
    build:
      context: ./src/server
      dockerfile: ./services/auth/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: "8081"
      DATABASE_HOST: auth_db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_NAME: ${DB_NAME:-nova_auth}
      DATABASE_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-to-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      ADMIN_USERID: ${ADMIN_USERID:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    depends_on:
      auth_db:
        condition: service_healthy
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/api/v1/auth/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova_network

  gateway:
    build:
      context: ./src/server
      dockerfile: ./services/gateway/Dockerfile
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova_network

volumes:
  auth_db_data:

networks:
  nova_network:
    driver: bridge
